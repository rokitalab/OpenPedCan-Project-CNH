name: Analysis

on:
  pull_request:

jobs:
  consensus_cn_manta:
    name: Run Analysis - Consensus CN Manta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: free disk space
        run: |
          echo "Disk usage before cleanup:" && df -h
          # Remove swap
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          # Remove pre-installed tools and caches
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          # Clean apt cache
          sudo apt-get clean || true
          # Docker cleanup
          docker system prune -af || true
          echo "Disk usage after cleanup:" && df -h
      - name: Download Data for Consensus CN Manta
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: ./download-data.sh
        env:
          OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
          OPENPEDCAN_RELEASE: testing
      - name: Run Consensus CN Manta
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: ./analyses/copy_number_consensus_call_manta/run_consensus_call.sh
  
  consensus_cn:
    name: Run Analysis - Consensus CN
    needs: consensus_cn_manta
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: free disk space
        run: |
          echo "Disk usage before cleanup:" && df -h
          # Remove swap
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          # Remove pre-installed tools and caches
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          # Clean apt cache
          sudo apt-get clean || true
          # Docker cleanup
          docker system prune -af || true
          echo "Disk usage after cleanup:" && df -h
      - name: Download Data for Consensus CN
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: ./download-data.sh
        env:
          OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
          OPENPEDCAN_RELEASE: testing
      - name: Run Consensus CN
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: ./analyses/copy_number_consensus_call/run_consensus_call.sh

  methylation_preprocessing:
    name: Run Analysis - Methylation Preprocessing
    runs-on: ubuntu-latest
    env:
      OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
      TESTING_DIR: methyl_testing
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: free disk space
        run: |
          echo "Disk usage before cleanup:" && df -h
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          sudo apt-get clean || true
          docker system prune -af || true
          echo "Disk usage after cleanup:" && df -h
      - name: Download methylation testing data
        run: bash scripts/download-methyl-testing.sh
      - name: Run Methylation Preprocessing
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            analyses/methylation-preprocessing/run-preprocess-illumina-arrays.sh
            --manifest_file data/methyl_testing/methylation-testing-manifest.tsv
            --input_dir data/methyl_testing
            --output_dir methylation-test-out
            --output_prefix test
      - name: Check expected outputs
        run: |
          ls -lh methylation-test-out
          # per-array outputs and sample QC must exist
          for pattern in 'IlluminaHumanMethylation450k-methyl-beta-values-masked' \
                         'IlluminaHumanMethylationEPIC-methyl-beta-values-masked' \
                         'IlluminaHumanMethylationEPICv2-methyl-beta-values-masked' \
                         'methyl-sample-qc'; do
            ls methylation-test-out/*"$pattern"*.parquet > /dev/null
          done
      # CNV calling needs the QC-filtered RGsets written by preprocessing above.
      # Reference (control) samples are the sample_type == 'Normal' rows of the
      # testing manifest, matched to each array by the manifest platform column.
      - name: Run Methylation CNV Calling - EPICv2
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            analyses/methylation-cnv-calling/run-methylation-cnv-calling.sh
            --rg-set-file methylation-test-out/test-IlluminaHumanMethylationEPICv2-rg-set.qs2
            --manifest-file data/methyl_testing/methylation-testing-manifest.tsv
            --output-dir methylation-cnv-test-out
            --output-prefix test-EPICv2
            --array-type EPICv2
      - name: Run Methylation CNV Calling - EPIC
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            analyses/methylation-cnv-calling/run-methylation-cnv-calling.sh
            --rg-set-file methylation-test-out/test-IlluminaHumanMethylationEPIC-rg-set.qs2
            --manifest-file data/methyl_testing/methylation-testing-manifest.tsv
            --output-dir methylation-cnv-test-out
            --output-prefix test-EPIC
            --array-type EPIC
      - name: Run Methylation CNV Calling - 450k
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            analyses/methylation-cnv-calling/run-methylation-cnv-calling.sh
            --rg-set-file methylation-test-out/test-IlluminaHumanMethylation450k-rg-set.qs2
            --manifest-file data/methyl_testing/methylation-testing-manifest.tsv
            --output-dir methylation-cnv-test-out
            --output-prefix test-450k
            --array-type 450k
      - name: Unpack hg19ToHg38 chain file
        run: gunzip -kf "data/$TESTING_DIR/hg19ToHg38.over.chain.gz"
      - name: Run Methylation CNV Segment Liftover and Combine
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            analyses/methylation-cnv-calling/run-methylation-cnv-calling.sh
            --combine-only
            --output-dir methylation-cnv-test-out
            --chain-file data/methyl_testing/hg19ToHg38.over.chain
      - name: Check expected CNV outputs
        run: |
          ls -lh methylation-cnv-test-out
          for array in EPICv2 EPIC 450k; do
            for suffix in segments gistic; do
              f="methylation-cnv-test-out/test-${array}-${suffix}.seg"
              test -s "$f" || { echo "Missing or empty: $f"; exit 1; }
            done
          done
          f="methylation-cnv-test-out/combined_hg38.gistic.seg"
          test -s "$f" || { echo "Missing or empty: $f"; exit 1; }

  run_analysis:
    name: Run Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Molecular subtyping modules
          - name: Molecular Subtyping
            entrypoint: molecular-subtyping/run-molecular-subtyping.sh
            openpbta_subset: 0

          - name: Molecular Subtyping - INTEGRATE (+ add cancer groups)
            entrypoint: molecular-subtyping-integrate/run-subtyping-integrate.sh
            

          # Analysis modules
          - name: Independent Specimens
            entrypoint: independent-samples/run-independent-samples.sh

          - name: Independent Specimens pre-release
            entrypoint: independent-samples/run-independent-samples.sh
            run_for_subtyping: 1

          - name: Gene set enrichment
            entrypoint: gene-set-enrichment-analysis/run-gsea.sh
            run_for_subtyping: 1
            openpbta_testing: 1

          - name: TP53/NF1 scores
            entrypoint: tp53_nf1_score/run_classifier.sh
            openpedcan_polya_strand: 0

          - name: Fusion filtering
            entrypoint: fusion_filtering/run_fusion_merged.sh

          - name: Consensus CN Manta
            entrypoint: copy_number_consensus_call_manta/run_consensus_call.sh

          - name: Consensus CN
            entrypoint: copy_number_consensus_call/run_consensus_call.sh

          - name: Consensus CN annotation
            entrypoint: focal-cn-file-preparation/run-prepare-cn.sh
            openpbta_testing: 1

          - name: TMB calculation
            entrypoint: tmb-calculation/run_tmb_calculation.sh
            
          - name: Mutational signatures
            entrypoint: mutational-signatures/run_mutational_signatures.sh
            openpbta_testing: 1

          - name: Immune Deconvolution
            entrypoint: immune-deconv/run-immune-deconv.sh

          #- name: EFO/MONDO annotation
          #  entrypoint: efo-mondo-mapping/run_search_and_qc.sh

          #- name: ENSEMBL Gene matching
          #  entrypoint: gene_match/run-gene-mapping.sh

          #- name: Update table annotation data
          #  entrypoint: long-format-table-utils/run-update-long-format-table-utils.sh

          #- name: RNA-Seq Expression Summary stats
          #  entrypoint: rna-seq-expression-summary-stats/run-rna-seq-expression-summary-stats.sh

          # MTP-specific modules
          #- name: Fusion frequency tables
          #  entrypoint: fusion-frequencies/run-frequencies.sh

          #- name: SNV frequency tables
          #  entrypoint: snv-frequencies/run-snv-frequencies.sh

          #- name: CNV frequency tables
          #  entrypoint: cnv-frequencies/run-cnv-frequencies-analysis.sh
            
          #- name: RNA-Seq batch correction
          #  entrypoint: rnaseq-batch-correct/run_ruvseq.sh

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd #v6.0.2
      - name: free disk space
        run: |
          echo "Disk usage before cleanup:" && df -h
          # Remove swap
          sudo swapoff -a || true
          sudo rm -f /swapfile || true
          # Remove pre-installed tools and caches
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc || true
          sudo rm -rf /usr/local/share/boost || true
          sudo rm -rf "$AGENT_TOOLSDIRECTORY" || true
          # Clean apt cache
          sudo apt-get clean || true
          # Docker cleanup
          docker system prune -af || true
          echo "Disk usage after cleanup:" && df -h
      - name: Download Data
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: ./download-data.sh
        env:
          OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
          OPENPEDCAN_RELEASE: testing

      - name: Download the parquet tables of the molecular subtyping (v15; only the beta values have a testing copy)
        if: matrix.name == 'Molecular Subtyping'
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: bash
          args: >-
            scripts/download-parquet.sh
            consensus_wgs_plus_cnvkit_wxs_plus_freec_tumor_only
            consensus_seg_with_status cnvkit_with_status
            fusion-annoFuse fusion-dgd snv-consensus-plus-hotspots sv-manta
            gene-expression-rsem-tpm-collapsed
        env:
          OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
          OPENPEDCAN_RELEASE: v15

      - name: Run Analysis
        uses: docker://pgc-images.sbgenomics.com/rokita-lab/openpedcanverse:latest
        with:
          entrypoint: analyses/${{ matrix.entrypoint }}
        env:
          OPENPBTA_SUBSET: ${{ matrix.openpbta_subset }}
          OPENPBTA_TESTING: ${{ matrix.openpbta_testing }}
          RUN_FOR_SUBTYPING: ${{ matrix.run_for_subtyping }}
          OPENPEDCAN_POLYA_STRAND: ${{ matrix.openpedcan_polya_strand }}
          # the beta values of the molecular subtyping have a small testing copy
          OPENPEDCAN_URL: https://s3.amazonaws.com/bti-openaccess-us-east-1-prd-opc
          METHYL_PARQUET_RELEASE: testing
          